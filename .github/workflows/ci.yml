name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile solver.py tritowers_cli.py tools/heuristic_baseline.py
      - name: Test
        run: python -m unittest -v test_solver.py test_cli.py test_perf_equiv.py test_setup_stock.py test_time_budget.py test_heuristic_baseline.py test_e2e_cli.py test_stock_empty.py
      - name: UI and vision tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_solver_ui.py tests/test_space_package.py
  vision:
    name: Photo reader
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Vision tests
        run: python -m pytest -q tests/test_reader.py tests/test_vision.py tests/test_calibrated.py tests/test_rank2.py tests/test_annotation.py tests/test_curation.py
  browser:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -r requirements.txt pytest playwright
          python -m playwright install --with-deps chromium
      - name: Browser tests
        run: TT_CHROME= python -m pytest -q tests/test_web_e2e.py
