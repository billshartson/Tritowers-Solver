name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: All Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      GRADIO_ANALYTICS_ENABLED: "False"
      TT_REQUIRE_TEST_FONTS: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install runtime and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-dejavu-core
          python -m pip install -r requirements.txt pytest httpx
          python -m pip check
      - name: Compile and import all runtime entrypoints
        run: |
          python -m compileall -q -x '/(.git|.venv|local)/' .
          python -c 'import app, web_app, web_shared, annotation_app, tritowers_vision; assert app.app is not None'
      - name: Discover every non-browser test
        run: python -m pytest -q -m 'not browser'
  browser:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    env:
      TT_REQUIRE_TEST_FONTS: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install -r requirements.txt pytest httpx playwright
          python -m playwright install --with-deps chromium
      - name: Build browser-only runtime (public sources only)
        run: python tools/prepare_static.py /tmp/tritowers-static --download-runtime
      - name: Browser tests (HTTP and real Pyodide worker)
        run: TT_CHROME= TT_STATIC_SITE=/tmp/tritowers-static python -m pytest -q -m browser
